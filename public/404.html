<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to CAREERLY...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // When a direct URL like /careerly-job-platform/jobs is requested,
      // GitHub Pages serves this 404.html. This script converts the pathname
      // into a hash route and immediately redirects to the application root.
      (function () {
        var repoName = '/careerly-job-platform';
        var path = window.location.pathname;
        if (path.indexOf(repoName) === 0) {
          path = path.slice(repoName.length);
        }
        var cleanPath = path.replace(/^\/+|\/+$/g, '');
        var search = window.location.search;
        var hash = cleanPath ? '#/' + cleanPath : '';
        if (search && hash) {
          hash += (hash.indexOf('?') === -1 ? '?' : '&') + search.slice(1);
        } else if (search) {
          hash = '#/' + search;
        }
        var targetUrl = window.location.origin + repoName + '/' + hash;
        window.location.replace(targetUrl);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to CAREERLY...</p>
  </body>
</html>
